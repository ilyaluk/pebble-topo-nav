<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --primary: #ff5722;
      --primary-hover: #f4511e;
      --border-color: #333333;
      --success: #4caf50;
      --error: #f44336;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    select {
      width: 100%;
      background-color: #2b2b2b;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .btn {
      display: block;
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 20px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #444444;
      color: #888888;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.success {
      background-color: rgba(76, 175, 80, 0.15);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.3);
      display: block;
    }

    .status-msg.error {
      background-color: rgba(244, 67, 54, 0.15);
      color: #e57373;
      border: 1px solid rgba(244, 67, 54, 0.3);
      display: block;
    }

    .trip-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .trip-item:last-child {
      border-bottom: none;
    }
    .trip-info {
      flex-grow: 1;
      margin-right: 15px;
    }
    .trip-date {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .trip-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .trip-actions {
      display: flex;
      gap: 8px;
    }
    .trip-btn {
      background-color: #2b2b2b;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .trip-btn:hover {
      background-color: var(--primary);
      color: white;
    }
    .trip-btn.danger:hover {
      background-color: var(--error);
      color: white;
    }
    .nav-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }
    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    .nav-text {
      font-size: 14px;
      font-weight: 500;
    }
    @media (max-width: 480px) {
      .trip-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 15px 0;
      }
      .trip-actions {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 data-i18n="title">TopoNav Settings</h1>

  <!-- Navigation Control -->
  <div class="card">
    <div class="card-title" data-i18n="cardNav">Navigation & Recording</div>
    <div class="nav-status">
      <div id="nav-dot" class="status-dot"></div>
      <span id="nav-status-text" class="nav-text">Recording inactive</span>
    </div>
    <button id="toggle-nav-btn" class="btn" style="margin-top: 0; background-color: var(--success);">Start Recording</button>
  </div>

  <!-- General Settings -->
  <div class="card">
    <div class="card-title" data-i18n="general">General</div>

    <label for="gps-interval" data-i18n="gpsInterval">GPS Update Interval</label>
    <select id="gps-interval">
      <option value="5" selected data-i18n="gps5">5 Seconds (Precise, more battery)</option>
      <option value="10" data-i18n="gps10">10 Seconds (Balanced)</option>
      <option value="30" data-i18n="gps30">30 Seconds (Power saving)</option>
    </select>

    <label for="app-lang" data-i18n="langLabel" style="margin-top: 15px;">App Language / App-Sprache</label>
    <select id="app-lang">
      <option value="en" selected>English</option>
      <option value="de">Deutsch</option>
    </select>
    
    <label for="map-source" data-i18n="mapSourceLabel" style="margin-top: 15px;">Map Source</label>
    <select id="map-source">
      <option value="opentopomap" selected data-i18n="mapOpenTopoMap">OpenTopoMap (Topographic, Default)</option>
      <option value="cyclosm" data-i18n="mapCyclOSM">CyclOSM (Outdoor, Hiking & Cycling)</option>
      <option value="mtbmap" data-i18n="mapMtbMap">MtbMap (High-contrast Trails)</option>
      <option value="osm" data-i18n="mapOsm">OpenStreetMap Standard (Fast / Clean)</option>
    </select>

    <label for="fullscreen-map" data-i18n="fullscreenLabel" style="margin-top: 15px;">Fullscreen Mode (Map)</label>
    <select id="fullscreen-map">
      <option value="false" selected data-i18n="fullscreenOff">Off (Standard Layout)</option>
      <option value="true" data-i18n="fullscreenOn">On (No Header/Footer)</option>
    </select>

    <label for="show-breadcrumbs" data-i18n="breadcrumbsLabel" style="margin-top: 15px;">Show Traveled Route</label>
    <select id="show-breadcrumbs">
      <option value="true" selected data-i18n="breadcrumbsOn">On</option>
      <option value="false" data-i18n="breadcrumbsOff">Off</option>
    </select>

    <label for="nav-view-mode" data-i18n="navViewModeLabel" style="margin-top: 15px;">Navigation View Mode</label>
    <select id="nav-view-mode">
      <option value="0" selected data-i18n="navViewMode0">Map + Auto-Popup</option>
      <option value="1" data-i18n="navViewMode1">Map Only (No Popup)</option>
      <option value="2" data-i18n="navViewMode2">Arrow Only (Permanent)</option>
    </select>

    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color);">
      <div data-i18n="dashboardFieldsLabel" style="font-weight: 600; margin-bottom: 5px; font-size: 14px;">Dashboard Data Fields</div>
      <div data-i18n="dashboardLimit" style="font-size: 12px; color: #666; margin-bottom: 10px;">(Max 4 selectable)</div>
      
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-speed" value="1" class="dashboard-cb" checked style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldSpeed">Average Speed</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-dist" value="2" class="dashboard-cb" checked style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldDist">Distance</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-gain" value="4" class="dashboard-cb" checked style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldGain">Elevation Gain</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-loss" value="8" class="dashboard-cb" checked style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldLoss">Elevation Loss</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-alt" value="16" class="dashboard-cb" style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldAlt">Altitude</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-time" value="32" class="dashboard-cb" style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldTime">Time of Day</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-duration" value="64" class="dashboard-cb" style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldDuration">Duration</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-heading" value="128" class="dashboard-cb" style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldHeading">Heading</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-battery" value="256" class="dashboard-cb" style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldBattery">Watch Battery</span>
      </label>
      <label style="display: flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="field-dist-dest" value="512" class="dashboard-cb" style="margin-right: 10px; width: 18px; height: 18px;">
        <span data-i18n="fieldDistDest">Distance to Dest</span>
      </label>
    </div>
  </div>

  <!-- GPX Import -->
  <div class="card">
    <div class="card-title" data-i18n="gpxRoute">GPX Route</div>

    <!-- Text Area Input for GPX XML content -->
    <label for="gpx-text" data-i18n="methodB">Copy &amp; paste GPX content (XML)</label>
    <textarea id="gpx-text" data-i18n-placeholder="textareaPlaceholder" placeholder="Open the .gpx file in a text app on your phone, copy the entire XML content and paste it here..." rows="6" style="width: 100%; background-color: #2b2b2b; border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; font-family: monospace; margin-top: 5px;"></textarea>
    
    <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml" style="display: none;">
    <button id="gpx-file-btn" data-i18n="gpxFileBtn" class="btn" style="background-color: #3e3e3e; margin-top: 10px; font-size: 14px; padding: 8px 12px; border: 1px solid var(--border-color); color: var(--text-color);">Choose GPX file (Experimental)</button>
    <div id="gpx-file-status" style="font-size: 12px; color: var(--text-muted); margin-top: 5px;"></div>
    
    <label for="route-name-input" data-i18n="routeNameLabel" style="margin-top: 15px;">Route Name (optional)</label>
    <input type="text" id="route-name-input" data-i18n-placeholder="routeNamePlaceholder" placeholder="e.g. Harz Hike" style="width: 100%; background-color: #2b2b2b; border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; margin-top: 5px; margin-bottom: 10px;">

    <button id="clear-btn" data-i18n="clearBtn" class="btn" style="background-color: var(--error); margin-top: 15px; font-size: 14px; padding: 8px 12px;">Remove current route</button>
    
    <div id="status-msg" class="status-msg"></div>
  </div>

  <!-- Saved Trips -->
  <div class="card">
    <div class="card-title" data-i18n="cardTrips">Recorded Trips</div>
    <div id="trips-list">
      <!-- Dynamically filled -->
    </div>
    <div id="no-trips-text" data-i18n="noTrips" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 15px 0;">No recorded trips.</div>
  </div>

  <!-- Saved Routes -->
  <div class="card">
    <div class="card-title" data-i18n="cardSavedRoutes">Saved Routes</div>
    <div id="routes-list">
      <!-- Dynamically filled -->
    </div>
    <div id="no-routes-text" data-i18n="noRoutes" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 15px 0;">No saved routes.</div>
  </div>

  <button id="save-btn" data-i18n="saveBtn" class="btn">Save</button>

  <!-- Modal for viewing recorded trip -->
  <div id="trip-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 1000; box-sizing: border-box; justify-content: center; align-items: center; padding: 15px;">
    <div class="card" style="width: 100%; max-width: 500px; height: 95%; max-height: 650px; margin: 0; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; position: relative;">
      <button id="modal-close-btn" style="position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 1010;">&times;</button>
      <div class="card-title" data-i18n="modalTitle" style="margin-right: 40px;">Trip Details</div>
      
      <div id="leaflet-map" style="width: 100%; height: 320px; background: #222; border-radius: 8px; border: 1px solid var(--border-color); flex-shrink: 0; margin-bottom: 15px; z-index: 1005;"></div>
      
      <div style="flex-grow: 1; overflow-y: auto; padding-right: 5px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center;">
            <div style="color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase;" data-i18n="modalDist">Distance</div>
            <div style="font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 5px;" id="modal-val-dist">-- km</div>
          </div>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center;">
            <div style="color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase;" data-i18n="modalDur">Duration</div>
            <div style="font-size: 18px; font-weight: 700; color: var(--text-color); margin-top: 5px;" id="modal-val-dur">-- min</div>
          </div>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center;">
            <div style="color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase;" data-i18n="modalSpeed">Average Speed</div>
            <div style="font-size: 18px; font-weight: 700; color: var(--text-color); margin-top: 5px;" id="modal-val-speed">-- km/h</div>
          </div>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center;">
            <div style="color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase;" data-i18n="modalEle">Elevation Profile</div>
            <div style="font-size: 16px; font-weight: 700; color: var(--text-color); margin-top: 5px;" id="modal-val-ele">-- m / -- m</div>
          </div>
        </div>
        <div style="font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 10px;" id="modal-val-date">--</div>
      </div>
    </div>
  </div>
</div>

  // Parse GPX from raw string
  function parseGPXText(gpxText) {
    var t = getTranslations();
    try {
      var parser = new DOMParser();
      var xmlDoc = parser.parseFromString(gpxText, "text/xml");
      
      // Basic check for XML parsing errors
      var parserError = xmlDoc.getElementsByTagName("parsererror");
      if (parserError.length > 0) {
        showStatus(t.statusXmlError, "error");
        saveBtn.disabled = true;
        return;
      }

      var trkpts = xmlDoc.getElementsByTagName("trkpt");
      if (trkpts.length === 0) {
        showStatus(t.statusNoTrkpt, "error");
        saveBtn.disabled = true;
        return;
      }

      var rawPoints = [];
      for (var i = 0; i < trkpts.length; i++) {
        var latVal = trkpts[i].getAttribute("lat");
        var lonVal = trkpts[i].getAttribute("lon");
        var eleEl = trkpts[i].getElementsByTagName("ele")[0];
        var eleVal = eleEl ? parseFloat(eleEl.textContent) : 0;
        if (latVal && lonVal) {
          rawPoints.push({
            lat: parseFloat(latVal),
            lon: parseFloat(lonVal),
            ele: eleVal
          });
        }
      }

      if (rawPoints.length === 0) {
        showStatus(t.statusNoCoords, "error");
        saveBtn.disabled = true;
        return;
      }

      // Simplify track using Douglas-Peucker to save memory (15m tolerance = 0.00015)
      trackPoints = simplifyDouglasPeucker(rawPoints, 0.00015);
      
      gpxUploaded = true;
      gpxCleared = false;
      showStatus(t.statusSuccess.replace("{raw}", rawPoints.length).replace("{reduced}", trackPoints.length), "success");
      saveBtn.disabled = false;
    } catch (err) {
      showStatus("Fehler / Error: " + err.message, "error");
      saveBtn.disabled = true;
    }
  }

  // Ramer-Douglas-Peucker Simplification
  function getSquareSegmentDistance(p, p1, p2) {
    var x = p1.lon, y = p1.lat;
    var dx = p2.lon - x, dy = p2.lat - y;
    if (dx !== 0 || dy !== 0) {
      var t = ((p.lon - x) * dx + (p.lat - y) * dy) / (dx * dx + dy * dy);
      if (t > 1) {
        x = p2.lon;
        y = p2.lat;
      } else if (t > 0) {
        x += dx * t;
      }
    }
    dx = p.lon - x;
    dy = p.lat - y;
    return dx * dx + dy * dy;
  }

  function simplifyDPStep(points, first, last, sqTolerance, simplified) {
    var maxSqDist = sqTolerance;
    var index = -1;
    for (var i = first + 1; i < last; i++) {
      var sqDist = getSquareSegmentDistance(points[i], points[first], points[last]);
      if (sqDist > maxSqDist) {
        index = i;
        maxSqDist = sqDist;
      }
    }
    if (maxSqDist > sqTolerance) {
      if (index - first > 1) simplifyDPStep(points, first, index, sqTolerance, simplified);
      simplified.push(points[index]);
      if (last - index > 1) simplifyDPStep(points, index, last, sqTolerance, simplified);
    }
  }

  function simplifyDouglasPeucker(points, tolerance) {
    if (points.length <= 2) return points;
    var sqTolerance = tolerance * tolerance;
    var simplified = [points[0]];
    simplifyDPStep(points, 0, points.length - 1, sqTolerance, simplified);
    simplified.push(points[points.length - 1]);
    return simplified;
  }

  // Load current settings from the injected params, or from the URL query
  // string when this page is loaded from a hosted copy.
  function getQueryParam(name) {
    if (window.TOPONAV_PARAMS && window.TOPONAV_PARAMS.hasOwnProperty(name)) {
      var injected = window.TOPONAV_PARAMS[name];
      return (injected === null || injected === undefined) ? null : String(injected);
    }
    var query = window.location.search.substring(1);
    var vars = query.split("&");
    for (var i = 0; i < vars.length; i++) {
      var pair = vars[i].split("=");
      try {
        if (decodeURIComponent(pair[0]) === name) {
          return decodeURIComponent(pair[1] || "");
        }
      } catch(e) {
        // Ignore URI malformed errors on truncated strings
        console.warn("URI decode error on param " + pair[0]);
      }
    }
    return null;
  }

  // Decompression of coordinates
  function decompressTrack(compressedStr) {
    if (!compressedStr) return [];
    var segments = compressedStr.split('|');
    var points = [];
    var lastLat = 0;
    var lastLon = 0;
    var lastEle = 0;
    var lastTime = 0;
    
    for (var i = 0; i < segments.length; i++) {
      var parts = segments[i].split(',');
      if (parts.length < 4) continue;
      
      var dLat = parseInt(parts[0], 10);
      var dLon = parseInt(parts[1], 10);
      var dEle = parseInt(parts[2], 10);
      var dTime = parseInt(parts[3], 10);
      
      if (i === 0) {
        lastLat = dLat;
        lastLon = dLon;
        lastEle = dEle;
        lastTime = dTime;
      } else {
        lastLat += dLat;
        lastLon += dLon;
        lastEle += dEle;
        lastTime += dTime;
      }
      
      points.push({
        lat: lastLat / 1000000,
        lon: lastLon / 1000000,
        ele: lastEle,
        time: lastTime
      });
    }
    return points;
  }

  function decompressPointsCompact(compressedStr) {
    if (!compressedStr) return [];
    var segments = compressedStr.split('|');
    var points = [];
    var lastLat = 0;
    var lastLon = 0;
    var lastEle = 0;
    var lastTime = 0;
    
    for (var i = 0; i < segments.length; i++) {
      var parts = segments[i].split(',');
      if (parts.length < 4) continue;
      
      var dLat = parseInt(parts[0], 36);
      var dLon = parseInt(parts[1], 36);
      var dEle = parseInt(parts[2], 36);
      var dTime = parseInt(parts[3], 36);
      
      if (i === 0) {
        lastLat = dLat;
        lastLon = dLon;
        lastEle = dEle;
        lastTime = dTime;
      } else {
        lastLat += dLat;
        lastLon += dLon;
        lastEle += dEle;
        lastTime += dTime;
      }
      
      points.push({
        lat: lastLat / 100000,
        lon: lastLon / 100000,
        ele: lastEle,
        time: lastTime * 1000
      });
    }
    return points;
  }

  function fallbackCopyText(text) {
    var textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    var t = getTranslations();
    try {
      if (document.execCommand('copy')) {
        alert(t.copySuccess);
      } else {
        alert(t.copyFailed);
      }
    } catch (err) {
      alert(t.copyFailedWith + err);
    }
    document.body.removeChild(textArea);
  }

  // Generate GPX XML content
  function generateGpxXml(points) {
    var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<gpx version="1.1" creator="TopoNav" xmlns="http://www.topografix.com/GPX/1/1">\n';
    xml += '  <trk>\n';
    xml += '    <name>TopoNav Walked Track</name>\n';
    xml += '    <trkseg>\n';
    
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var timeStr = new Date(p.time).toISOString();
      xml += '      <trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lon.toFixed(6) + '">\n';
      xml += '        <ele>' + p.ele + '</ele>\n';
      xml += '        <time>' + timeStr + '</time>\n';
      xml += '      </trkpt>\n';
    }
    
    xml += '    </trkseg>\n';
    xml += '  </trk>\n';
    xml += '</gpx>\n';
    return xml;
  }

  // Trigger download of files in webview
  function triggerFileDownload(content, filename) {
    var blob = new Blob([content], { type: 'application/gpx+xml;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename + ".gpx";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  var leafletMapInstance = null;

  function getLeafletTileUrl(mapSource) {
    if (mapSource === 'cyclosm' || mapSource === 'hikebikemap') {
      return 'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png';
    } else if (mapSource === 'mtbmap') {
      return 'https://tile.mtbmap.cz/mtbmap_tiles/{z}/{x}/{y}.png';
    } else if (mapSource === 'osm') {
      return 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    } else { // opentopomap
      return 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';
    }
  }

  function showTripModal(points, tripId) {
    var t = getTranslations();
    
    var tripMeta = null;
    if (savedTripsMeta) {
      for (var i = 0; i < savedTripsMeta.length; i++) {
        if (savedTripsMeta[i].id === tripId) {
          tripMeta = savedTripsMeta[i];
          break;
        }
      }
    }
    
    if (!tripMeta) return;
    
    var distKm = (tripMeta.distance / 1000).toFixed(2);
    document.getElementById("modal-val-dist").innerText = distKm + " km";
    
    var durationMin = Math.round(tripMeta.duration / 60);
    var durStr = durationMin + " min";
    if (durationMin >= 60) {
      var h = Math.floor(durationMin / 60);
      var m = durationMin % 60;
      durStr = h + "h " + m + "m";
    }
    document.getElementById("modal-val-dur").innerText = durStr;
    
    var avgSpeed = tripMeta.duration > 0 ? ((tripMeta.distance / tripMeta.duration) * 3.6).toFixed(1) : "0.0";
    document.getElementById("modal-val-speed").innerText = avgSpeed + " km/h";
    
    var gain = 0;
    var loss = 0;
    for (var k = 0; k < points.length - 1; k++) {
      if (points[k].ele !== undefined && points[k+1].ele !== undefined) {
        var diff = points[k+1].ele - points[k].ele;
        if (diff > 0) gain += diff;
        else loss += Math.abs(diff);
      }
    }
    document.getElementById("modal-val-ele").innerText = "+" + Math.round(gain) + "m / -" + Math.round(loss) + "m";
    
    var dateObj = new Date(tripMeta.date);
    document.getElementById("modal-val-date").innerText = dateObj.toLocaleDateString(t.locale) + " " + dateObj.toLocaleTimeString(t.locale, {hour: '2-digit', minute:'2-digit'});
    
    var modal = document.getElementById("trip-modal");
    modal.style.display = "flex";
    
    if (typeof L === 'undefined') {
      console.warn("Leaflet map library is not loaded.");
      document.getElementById("leaflet-map").innerHTML = '<div style="display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-muted); padding: 20px; text-align: center;">' + (t.offlineWarning || "Internet connection required to load map.") + '</div>';
      return;
    }
    
    document.getElementById("leaflet-map").innerHTML = "";

    if (leafletMapInstance) {
      leafletMapInstance.remove();
    }
    
    var mapSource = document.getElementById("map-source").value;
    var tileUrl = getLeafletTileUrl(mapSource);
    
    leafletMapInstance = L.map('leaflet-map', {
      maxZoom: 17
    });
    
    L.tileLayer(tileUrl, {
      maxZoom: 17,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(leafletMapInstance);
    
    var latlngs = points.map(function(p) {
      return [p.lat, p.lon];
    });
    
    var polyline = L.polyline(latlngs, {color: 'var(--primary)', weight: 4}).addTo(leafletMapInstance);
    
    if (latlngs.length > 0) {
      L.circleMarker(latlngs[0], {radius: 6, fillColor: '#4caf50', color: '#fff', weight: 2, fillOpacity: 1}).addTo(leafletMapInstance);
      L.circleMarker(latlngs[latlngs.length - 1], {radius: 6, fillColor: '#f44336', color: '#fff', weight: 2, fillOpacity: 1}).addTo(leafletMapInstance);
    }
    
    leafletMapInstance.fitBounds(polyline.getBounds(), {padding: [20, 20]});
    
    setTimeout(function() {
      if (leafletMapInstance) {
        leafletMapInstance.invalidateSize();
      }
    }, 250);
  }

  document.getElementById("modal-close-btn").addEventListener("click", function() {
    document.getElementById("trip-modal").style.display = "none";
    if (leafletMapInstance) {
      leafletMapInstance.remove();
      leafletMapInstance = null;
    }
  });



  // Checkbox limit logic
  var maxFields = 4;
  var dashboardCheckboxes = document.querySelectorAll('.dashboard-cb');
  
  function updateCheckboxStates() {
    var checkedCount = document.querySelectorAll('.dashboard-cb:checked').length;
    dashboardCheckboxes.forEach(function(cb) {
      if (!cb.checked) {
        cb.disabled = (checkedCount >= maxFields);
      }
    });
  }
  
  dashboardCheckboxes.forEach(function(cb) {
    cb.addEventListener('change', function() {
      var checkedCount = document.querySelectorAll('.dashboard-cb:checked').length;
      if (checkedCount > maxFields) {
        this.checked = false; // Revert
        alert(getTranslations().maxFields);
      }
      updateCheckboxStates();
    });
  });
  
  // Initial state check
  updateCheckboxStates();

  // Apply language at start
  applyLanguage();
</script>
