<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TopoNav Einstellungen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --primary: #ff5722;
      --primary-hover: #f4511e;
      --border-color: #333333;
      --success: #4caf50;
      --error: #f44336;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    select, input[type="file"] {
      width: 100%;
      background-color: #2b2b2b;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .dropzone {
      position: relative;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.02);
      transition: background-color 0.2s, border-color 0.2s;
      overflow: hidden;
    }

    .dropzone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      display: block;
      z-index: 10;
    }

    .dropzone p, .dropzone span {
      pointer-events: none;
    }

    .dropzone.dragover {
      background-color: rgba(255, 87, 34, 0.05);
      border-color: var(--primary);
    }

    .dropzone p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .dropzone span {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn {
      display: block;
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 20px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #444444;
      color: #888888;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.success {
      background-color: rgba(76, 175, 80, 0.15);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.3);
      display: block;
    }

    .status-msg.error {
      background-color: rgba(244, 67, 54, 0.15);
      color: #e57373;
      border: 1px solid rgba(244, 67, 54, 0.3);
      display: block;
    }

    .trip-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .trip-item:last-child {
      border-bottom: none;
    }
    .trip-info {
      flex-grow: 1;
      margin-right: 15px;
    }
    .trip-date {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .trip-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .trip-actions {
      display: flex;
      gap: 8px;
    }
    .trip-btn {
      background-color: #2b2b2b;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .trip-btn:hover {
      background-color: var(--primary);
      color: white;
    }
    .trip-btn.danger:hover {
      background-color: var(--error);
      color: white;
    }
    .nav-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }
    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    .nav-text {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 id="page-title">TopoNav Einstellungen</h1>

  <!-- Navigation Control -->
  <div class="card">
    <div class="card-title" id="card-nav">Navigation & Aufzeichnung</div>
    <div class="nav-status">
      <div id="nav-dot" class="status-dot"></div>
      <span id="nav-status-text" class="nav-text">Inaktiv</span>
    </div>
    <button id="toggle-nav-btn" class="btn" style="margin-top: 0; background-color: var(--success);">Aufzeichnung starten</button>
  </div>

  <!-- General Settings -->
  <div class="card">
    <div class="card-title" id="card-general">Allgemein</div>
    
    <label for="gps-interval" id="label-gps-interval">GPS-Aktualisierungsintervall</label>
    <select id="gps-interval">
      <option value="5" selected>5 Sekunden (Präzise, mehr Akku)</option>
      <option value="10">10 Sekunden (Ausgeglichen)</option>
      <option value="30">30 Sekunden (Stromsparend)</option>
    </select>
    
    <label for="app-lang" id="label-app-lang" style="margin-top: 15px;">App-Sprache / App Language</label>
    <select id="app-lang">
      <option value="de" selected>Deutsch</option>
      <option value="en">English</option>
    </select>
  </div>

  <!-- GPX Import -->
  <div class="card">
    <div class="card-title" id="card-gpx">GPX-Route</div>
    
    <!-- Method A: File Upload (for supported platforms/browsers) -->
    <label id="label-method-a">Methode A: GPX-Datei auswählen</label>
    <div id="dropzone" class="dropzone">
      <p id="dropzone-text">Klicke zum Auswählen oder ziehe eine GPX-Datei hierher</p>
      <span id="formats-span">Erlaubte Formate: .gpx</span>
      <input type="file" id="gpx-file" accept=".gpx">
    </div>
    
    <div id="or-div" style="text-align: center; margin: 15px 0; color: var(--text-muted); font-size: 13px; font-weight: bold;">— ODER —</div>
    
    <!-- Method B: Text Area Fallback (for standard mobile webviews) -->
    <label for="gpx-text" id="label-method-b">Methode B: GPX-Inhalt kopieren & einfügen (für Smartphones)</label>
    <textarea id="gpx-text" placeholder="Öffne die .gpx Datei in einer Text-App auf deinem Handy, kopiere den gesamten XML-Inhalt und füge ihn hier ein..." rows="6" style="width: 100%; background-color: #2b2b2b; border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; font-family: monospace; margin-top: 5px;"></textarea>
    
    <label for="route-name-input" id="label-route-name" style="margin-top: 15px;">Name der Route (optional)</label>
    <input type="text" id="route-name-input" placeholder="z.B. Harz Wanderung" style="width: 100%; background-color: #2b2b2b; border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; margin-top: 5px; margin-bottom: 10px;">

    <button id="clear-btn" class="btn" style="background-color: var(--error); margin-top: 15px; font-size: 14px; padding: 8px 12px;">Aktuelle Route entfernen</button>
    
    <div id="status-msg" class="status-msg"></div>
  </div>

  <!-- Saved Trips -->
  <div class="card">
    <div class="card-title" id="card-trips">Aufgezeichnete Touren</div>
    <div id="trips-list">
      <!-- Dynamically filled -->
    </div>
    <div id="no-trips-text" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 15px 0;">Keine Touren aufgezeichnet.</div>
  </div>

  <!-- Saved Routes -->
  <div class="card">
    <div class="card-title" id="card-saved-routes">Gespeicherte Routen</div>
    <div id="routes-list">
      <!-- Dynamically filled -->
    </div>
    <div id="no-routes-text" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 15px 0;">Keine Routen gespeichert.</div>
  </div>

  <button id="save-btn" class="btn">Speichern</button>
</div>

<script>
  // State Variables
  var trackPoints = [];
  var gpxUploaded = false;
  var gpxCleared = false;

  var translations = {
    de: {
      title: "TopoNav Einstellungen",
      general: "Allgemein",
      gpsInterval: "GPS-Aktualisierungsintervall",
      gps5: "5 Sekunden (Präzise, mehr Akku)",
      gps10: "10 Sekunden (Ausgeglichen)",
      gps30: "30 Sekunden (Stromsparend)",
      langLabel: "App-Sprache / App Language",
      gpxRoute: "GPX-Route",
      methodA: "Methode A: GPX-Datei auswählen",
      dropzoneText: "Klicke zum Auswählen oder ziehe eine GPX-Datei hierher",
      formats: "Erlaubte Formate: .gpx",
      orText: "— ODER —",
      methodB: "Methode B: GPX-Inhalt kopieren & einfügen (für Smartphones)",
      textareaPlaceholder: "Öffne die .gpx Datei in einer Text-App auf deinem Handy, kopiere den gesamten XML-Inhalt und füge ihn hier ein...",
      clearBtn: "Aktuelle Route entfernen",
      saveBtn: "Speichern",
      statusErrorFile: "Fehler: Bitte wähle eine valide .gpx Datei.",
      statusReading: "Lese {name}...",
      statusPoints: " Punkte",
      statusXmlError: "Fehler beim Parsen: Ungültiges XML-Format.",
      statusNoTrkpt: "Fehler: Keine <trkpt>-Elemente (Trackpoints) in den GPX-Daten gefunden.",
      statusNoCoords: "Fehler: Trackpoints enthalten keine Koordinaten (lat/lon).",
      statusSuccess: "GPX-Daten erfolgreich geladen! {raw} Punkte wurden auf {reduced} reduziert.",
      statusCleared: "Route entfernt. Klicke auf 'Speichern', um die Änderung auf der Uhr zu übernehmen.",
      cardNav: "Navigation & Aufzeichnung",
      navActive: "Aufzeichnung läuft...",
      navInactive: "Aufzeichnung inaktiv",
      btnStartNav: "Aufzeichnung starten",
      btnStopNav: "Aufzeichnung stoppen",
      cardTrips: "Aufgezeichnete Touren",
      noTrips: "Keine Touren aufgezeichnet.",
      btnDownload: "GPX herunterladen",
      btnDelete: "Löschen",
      tripDistance: "Distanz",
      tripDuration: "Dauer",
      tripPoints: "Punkte",
      cardSavedRoutes: "Gespeicherte Routen",
      noRoutes: "Keine Routen gespeichert.",
      btnActivate: "Aktivieren",
      activeLabel: "Aktiv"
    },
    en: {
      title: "TopoNav Settings",
      general: "General",
      gpsInterval: "GPS Update Interval",
      gps5: "5 Seconds (Precise, more battery)",
      gps10: "10 Seconds (Balanced)",
      gps30: "30 Seconds (Power saving)",
      langLabel: "App Language / App-Sprache",
      gpxRoute: "GPX Route",
      methodA: "Method A: Select GPX file",
      dropzoneText: "Click to select or drag and drop a GPX file here",
      formats: "Allowed formats: .gpx",
      orText: "— OR —",
      methodB: "Method B: Copy & paste GPX content (for smartphones)",
      textareaPlaceholder: "Open the .gpx file in a text app on your phone, copy the entire XML content and paste it here...",
      clearBtn: "Remove current route",
      saveBtn: "Save",
      statusErrorFile: "Error: Please select a valid .gpx file.",
      statusReading: "Reading {name}...",
      statusPoints: " points",
      statusXmlError: "Parse Error: Invalid XML format.",
      statusNoTrkpt: "Error: No <trkpt> elements (trackpoints) found in the GPX data.",
      statusNoCoords: "Error: Trackpoints do not contain coordinates (lat/lon).",
      statusSuccess: "GPX data successfully loaded! {raw} points reduced to {reduced}.",
      statusCleared: "Route removed. Click 'Save' to apply the change on the watch.",
      cardNav: "Navigation & Recording",
      navActive: "Recording active...",
      navInactive: "Recording inactive",
      btnStartNav: "Start Recording",
      btnStopNav: "Stop Recording",
      cardTrips: "Recorded Trips",
      noTrips: "No recorded trips.",
      btnDownload: "Download GPX",
      btnDelete: "Delete",
      tripDistance: "Distance",
      tripDuration: "Duration",
      tripPoints: "Points",
      cardSavedRoutes: "Saved Routes",
      noRoutes: "No saved routes.",
      btnActivate: "Activate",
      activeLabel: "Active"
    }
  };

  function getActiveLang() {
    return document.getElementById("app-lang").value;
  }

  function applyLanguage(lang) {
    var t = translations[lang] || translations.de;
    document.getElementById("page-title").innerText = t.title;
    document.getElementById("card-general").innerText = t.general;
    document.getElementById("label-gps-interval").innerText = t.gpsInterval;
    
    var intervalSelect = document.getElementById("gps-interval");
    intervalSelect.options[0].text = t.gps5;
    intervalSelect.options[1].text = t.gps10;
    intervalSelect.options[2].text = t.gps30;
    
    document.getElementById("label-app-lang").innerText = t.langLabel;
    document.getElementById("card-gpx").innerText = t.gpxRoute;
    document.getElementById("label-method-a").innerText = t.methodA;
    
    if (!gpxUploaded && !gpxCleared) {
      document.getElementById("dropzone-text").innerText = t.dropzoneText;
    }
    document.getElementById("formats-span").innerText = t.formats;
    document.getElementById("or-div").innerText = t.orText;
    document.getElementById("label-method-b").innerText = t.methodB;
    document.getElementById("gpx-text").placeholder = t.textareaPlaceholder;
    document.getElementById("clear-btn").innerText = t.clearBtn;
    document.getElementById("save-btn").innerText = t.saveBtn;

    // Translate new items
    document.getElementById("card-nav").innerText = t.cardNav;
    document.getElementById("card-trips").innerText = t.cardTrips;
    document.getElementById("no-trips-text").innerText = t.noTrips;
    
    document.getElementById("card-saved-routes").innerText = t.cardSavedRoutes;
    document.getElementById("no-routes-text").innerText = t.noRoutes;
    document.getElementById("label-route-name").innerText = lang === "de" ? "Name der Route (optional)" : "Route Name (optional)";
    
    updateNavStatusUI();
    renderTripsList();
    renderRoutesList();
  }

  // UI elements
  var dropzone = document.getElementById("dropzone");
  var gpxInput = document.getElementById("gpx-file");
  var dropzoneText = document.getElementById("dropzone-text");
  var gpxTextArea = document.getElementById("gpx-text");
  var clearBtn = document.getElementById("clear-btn");
  var statusMsg = document.getElementById("status-msg");
  var saveBtn = document.getElementById("save-btn");

  // Handle Drag & Drop (for desktop/browsers where it is supported)
  dropzone.addEventListener("dragover", function(e) {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });
  dropzone.addEventListener("dragleave", function() {
    dropzone.classList.remove("dragover");
  });
  dropzone.addEventListener("drop", function(e) {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });
  gpxInput.addEventListener("change", function() {
    if (gpxInput.files.length > 0) {
      handleFile(gpxInput.files[0]);
    }
  });

  // Read file via FileReader
  function handleFile(file) {
    var lang = getActiveLang();
    var t = translations[lang] || translations.de;
    if (!file.name.endsWith(".gpx")) {
      showStatus(t.statusErrorFile, "error");
      return;
    }
    dropzoneText.innerText = t.statusReading.replace("{name}", file.name);
    
    var reader = new FileReader();
    reader.onload = function(e) {
      parseGPXText(e.target.result);
      if (trackPoints.length > 0) {
        dropzoneText.innerText = file.name + " (" + trackPoints.length + t.statusPoints + ")";
      } else {
        dropzoneText.innerText = t.dropzoneText;
      }
    };
    reader.readAsText(file);
  }

  // Listen to input changes in the fallback textarea
  gpxTextArea.addEventListener("input", function() {
    var text = gpxTextArea.value.trim();
    if (text.length > 0) {
      parseGPXText(text);
    } else {
      statusMsg.className = "status-msg";
      statusMsg.innerText = "";
      saveBtn.disabled = false;
      trackPoints = [];
      gpxUploaded = false;
      gpxCleared = false;
    }
  });

  // Handle clearing the GPX route
  clearBtn.addEventListener("click", function(e) {
    var lang = getActiveLang();
    var t = translations[lang] || translations.de;
    e.preventDefault();
    trackPoints = [];
    gpxUploaded = false;
    gpxCleared = true;
    gpxInput.value = "";
    gpxTextArea.value = "";
    dropzoneText.innerText = t.dropzoneText;
    showStatus(t.statusCleared, "success");
    saveBtn.disabled = false;
  });

  // Parse GPX from raw string
  function parseGPXText(gpxText) {
    var lang = getActiveLang();
    var t = translations[lang] || translations.de;
    try {
      var parser = new DOMParser();
      var xmlDoc = parser.parseFromString(gpxText, "text/xml");
      
      // Basic check for XML parsing errors
      var parserError = xmlDoc.getElementsByTagName("parsererror");
      if (parserError.length > 0) {
        showStatus(t.statusXmlError, "error");
        saveBtn.disabled = true;
        return;
      }

      var trkpts = xmlDoc.getElementsByTagName("trkpt");
      if (trkpts.length === 0) {
        showStatus(t.statusNoTrkpt, "error");
        saveBtn.disabled = true;
        return;
      }

      var rawPoints = [];
      for (var i = 0; i < trkpts.length; i++) {
        var latVal = trkpts[i].getAttribute("lat");
        var lonVal = trkpts[i].getAttribute("lon");
        var eleEl = trkpts[i].getElementsByTagName("ele")[0];
        var eleVal = eleEl ? parseFloat(eleEl.textContent) : 0;
        if (latVal && lonVal) {
          rawPoints.push({
            lat: parseFloat(latVal),
            lon: parseFloat(lonVal),
            ele: eleVal
          });
        }
      }

      if (rawPoints.length === 0) {
        showStatus(t.statusNoCoords, "error");
        saveBtn.disabled = true;
        return;
      }

      // Simplify track using Douglas-Peucker to save memory (15m tolerance = 0.00015)
      trackPoints = simplifyDouglasPeucker(rawPoints, 0.00015);
      
      gpxUploaded = true;
      gpxCleared = false;
      showStatus(t.statusSuccess.replace("{raw}", rawPoints.length).replace("{reduced}", trackPoints.length), "success");
      saveBtn.disabled = false;
    } catch (err) {
      showStatus("Fehler / Error: " + err.message, "error");
      saveBtn.disabled = true;
    }
  }

  // Ramer-Douglas-Peucker Simplification
  function getSquareSegmentDistance(p, p1, p2) {
    var x = p1.lon, y = p1.lat;
    var dx = p2.lon - x, dy = p2.lat - y;
    if (dx !== 0 || dy !== 0) {
      var t = ((p.lon - x) * dx + (p.lat - y) * dy) / (dx * dx + dy * dy);
      if (t > 1) {
        x = p2.lon;
        y = p2.lat;
      } else if (t > 0) {
        x += dx * t;
      }
    }
    dx = p.lon - x;
    dy = p.lat - y;
    return dx * dx + dy * dy;
  }

  function simplifyDPStep(points, first, last, sqTolerance, simplified) {
    var maxSqDist = sqTolerance;
    var index = -1;
    for (var i = first + 1; i < last; i++) {
      var sqDist = getSquareSegmentDistance(points[i], points[first], points[last]);
      if (sqDist > maxSqDist) {
        index = i;
        maxSqDist = sqDist;
      }
    }
    if (maxSqDist > sqTolerance) {
      if (index - first > 1) simplifyDPStep(points, first, index, sqTolerance, simplified);
      simplified.push(points[index]);
      if (last - index > 1) simplifyDPStep(points, index, last, sqTolerance, simplified);
    }
  }

  function simplifyDouglasPeucker(points, tolerance) {
    if (points.length <= 2) return points;
    var sqTolerance = tolerance * tolerance;
    var simplified = [points[0]];
    simplifyDPStep(points, 0, points.length - 1, sqTolerance, simplified);
    simplified.push(points[points.length - 1]);
    return simplified;
  }

  function showStatus(msg, type) {
    statusMsg.innerText = msg;
    statusMsg.className = "status-msg " + type;
  }

  // Saved routes list rendering
  var routesParam = getQueryParam("routes");
  var savedRoutesMeta = [];
  if (routesParam) {
    try {
      savedRoutesMeta = JSON.parse(decodeURIComponent(routesParam));
    } catch(e) {
      console.log('Error parsing routes parameter: ' + e);
    }
  }
  
  var activeRouteId = parseInt(getQueryParam("active_route_id") || "0", 10);

  function renderRoutesList() {
    var listContainer = document.getElementById("routes-list");
    var noRoutesText = document.getElementById("no-routes-text");
    listContainer.innerHTML = "";
    
    var lang = getActiveLang();
    var t = translations[lang] || translations.de;
    
    if (!savedRoutesMeta || savedRoutesMeta.length === 0) {
      noRoutesText.style.display = "block";
      return;
    }
    
    noRoutesText.style.display = "none";
    
    savedRoutesMeta.forEach(function(route) {
      var item = document.createElement("div");
      item.className = "trip-item";
      
      var info = document.createElement("div");
      info.className = "trip-info";
      
      var nameDiv = document.createElement("div");
      nameDiv.className = "trip-date";
      nameDiv.innerText = route.name;
      
      var metaDiv = document.createElement("div");
      metaDiv.className = "trip-meta";
      var distKm = (route.distance / 1000).toFixed(2);
      metaDiv.innerText = t.tripDistance + ": " + distKm + " km | " + t.tripPoints + ": " + route.pointsCount;
      
      info.appendChild(nameDiv);
      info.appendChild(metaDiv);
      
      var actions = document.createElement("div");
      actions.className = "trip-actions";
      
      var isActive = (route.id === activeRouteId);
      
      if (isActive) {
        var activeSpan = document.createElement("span");
        activeSpan.className = "nav-text";
        activeSpan.style.color = "var(--success)";
        activeSpan.style.fontWeight = "bold";
        activeSpan.style.marginRight = "10px";
        activeSpan.innerText = t.activeLabel;
        actions.appendChild(activeSpan);
        
        var deactBtn = document.createElement("button");
        deactBtn.className = "trip-btn";
        deactBtn.innerText = lang === "de" ? "Stoppen" : "Stop";
        deactBtn.addEventListener("click", function() {
          window.location.href = "pebblejs://close#activate_route_0";
        });
        actions.appendChild(deactBtn);
      } else {
        var actBtn = document.createElement("button");
        actBtn.className = "trip-btn";
        actBtn.innerText = t.btnActivate;
        actBtn.addEventListener("click", function() {
          window.location.href = "pebblejs://close#activate_route_" + route.id;
        });
        actions.appendChild(actBtn);
      }
      
      var delBtn = document.createElement("button");
      delBtn.className = "trip-btn danger";
      delBtn.innerText = t.btnDelete;
      delBtn.addEventListener("click", function() {
        if (confirm(lang === "de" ? "Diese Route wirklich löschen?" : "Really delete this route?")) {
          window.location.href = "pebblejs://close#delete_route_" + route.id;
        }
      });
      
      actions.appendChild(delBtn);
      
      item.appendChild(info);
      item.appendChild(actions);
      listContainer.appendChild(item);
    });
  }

  // Submit and Close WebView
  saveBtn.addEventListener("click", function() {
    var gpsInterval = parseInt(document.getElementById("gps-interval").value);
    var appLang = document.getElementById("app-lang").value;
    
    var settings = {
      gpsInterval: gpsInterval,
      language: appLang
    };
    
    if (gpxCleared) {
      settings.gpxTrack = [];
    } else if (gpxUploaded && trackPoints.length > 0) {
      var nameInput = document.getElementById("route-name-input").value.trim();
      var rName = nameInput || ("Route " + (new Date().toLocaleDateString()));
      settings.newRoute = {
        name: rName,
        points: trackPoints
      };
    }
    
    // Redirect to pebblejs schema to pass data to phone companion
    var location = "pebblejs://close#" + encodeURIComponent(JSON.stringify(settings));
    window.location.href = location;
  });

  // Load current settings from URL query parameters
  function getQueryParam(name) {
    var query = window.location.search.substring(1);
    var vars = query.split("&");
    for (var i = 0; i < vars.length; i++) {
      var pair = vars[i].split("=");
      if (decodeURIComponent(pair[0]) === name) {
        return decodeURIComponent(pair[1]);
      }
    }
    return null;
  }
  
  var initialInterval = getQueryParam("interval");
  if (initialInterval) {
    document.getElementById("gps-interval").value = initialInterval;
  }
  
  var initialLang = getQueryParam("lang");
  if (initialLang) {
    document.getElementById("app-lang").value = initialLang;
  }
  
  // Listen for language dropdown change
  document.getElementById("app-lang").addEventListener("change", function() {
    applyLanguage(this.value);
  });
  
  // Navigation active state control
  var isNavActive = getQueryParam("is_nav") === "true";
  
  function updateNavStatusUI() {
    var lang = getActiveLang();
    var t = translations[lang] || translations.de;
    var dot = document.getElementById("nav-dot");
    var statusText = document.getElementById("nav-status-text");
    var btn = document.getElementById("toggle-nav-btn");
    
    if (isNavActive) {
      dot.className = "status-dot active";
      statusText.innerText = t.navActive;
      btn.innerText = t.btnStopNav;
      btn.style.backgroundColor = "var(--error)";
    } else {
      dot.className = "status-dot";
      statusText.innerText = t.navInactive;
      btn.innerText = t.btnStartNav;
      btn.style.backgroundColor = "var(--success)";
    }
  }
  
  document.getElementById("toggle-nav-btn").addEventListener("click", function(e) {
    e.preventDefault();
    window.location.href = "pebblejs://close#toggle_nav";
  });

  // Saved trips list rendering
  var tripsParam = getQueryParam("trips");
  var savedTripsMeta = [];
  if (tripsParam) {
    try {
      savedTripsMeta = JSON.parse(decodeURIComponent(tripsParam));
    } catch(e) {
      console.log('Error parsing trips param: ' + e);
    }
  }

  function renderTripsList() {
    var listContainer = document.getElementById("trips-list");
    var noTripsText = document.getElementById("no-trips-text");
    listContainer.innerHTML = "";
    
    var lang = getActiveLang();
    var t = translations[lang] || translations.de;
    
    if (!savedTripsMeta || savedTripsMeta.length === 0) {
      noTripsText.style.display = "block";
      return;
    }
    
    noTripsText.style.display = "none";
    
    savedTripsMeta.forEach(function(trip) {
      var item = document.createElement("div");
      item.className = "trip-item";
      
      var info = document.createElement("div");
      info.className = "trip-info";
      
      var dateDiv = document.createElement("div");
      dateDiv.className = "trip-date";
      var dateObj = new Date(trip.date);
      dateDiv.innerText = dateObj.toLocaleDateString(lang === "de" ? "de-DE" : "en-US") + " " + dateObj.toLocaleTimeString(lang === "de" ? "de-DE" : "en-US", {hour: '2-digit', minute:'2-digit'});
      
      var metaDiv = document.createElement("div");
      metaDiv.className = "trip-meta";
      
      var distKm = (trip.distance / 1000).toFixed(2);
      var durationMin = Math.round(trip.duration / 60);
      var durStr = durationMin + " min";
      if (durationMin >= 60) {
        var h = Math.floor(durationMin / 60);
        var m = durationMin % 60;
        durStr = h + "h " + m + "m";
      }
      
      metaDiv.innerText = t.tripDistance + ": " + distKm + " km | " + t.tripDuration + ": " + durStr + " | " + t.tripPoints + ": " + trip.pointsCount;
      
      info.appendChild(dateDiv);
      info.appendChild(metaDiv);
      
      var actions = document.createElement("div");
      actions.className = "trip-actions";
      
      var dlBtn = document.createElement("button");
      dlBtn.className = "trip-btn";
      dlBtn.innerText = t.btnDownload;
      dlBtn.addEventListener("click", function() {
        window.location.href = "pebblejs://close#download_" + trip.id;
      });
      
      var delBtn = document.createElement("button");
      delBtn.className = "trip-btn danger";
      delBtn.innerText = t.btnDelete;
      delBtn.addEventListener("click", function() {
        if (confirm(lang === "de" ? "Diese Tour wirklich löschen?" : "Really delete this trip?")) {
          window.location.href = "pebblejs://close#delete_" + trip.id;
        }
      });
      
      actions.appendChild(dlBtn);
      actions.appendChild(delBtn);
      
      item.appendChild(info);
      item.appendChild(actions);
      listContainer.appendChild(item);
    });
  }

  // Decompression of coordinates
  function decompressTrack(compressedStr) {
    if (!compressedStr) return [];
    var segments = compressedStr.split('|');
    var points = [];
    var lastLat = 0;
    var lastLon = 0;
    var lastEle = 0;
    var lastTime = 0;
    
    for (var i = 0; i < segments.length; i++) {
      var parts = segments[i].split(',');
      if (parts.length < 4) continue;
      
      var dLat = parseInt(parts[0], 10);
      var dLon = parseInt(parts[1], 10);
      var dEle = parseInt(parts[2], 10);
      var dTime = parseInt(parts[3], 10);
      
      if (i === 0) {
        lastLat = dLat;
        lastLon = dLon;
        lastEle = dEle;
        lastTime = dTime;
      } else {
        lastLat += dLat;
        lastLon += dLon;
        lastEle += dEle;
        lastTime += dTime;
      }
      
      points.push({
        lat: lastLat / 1000000,
        lon: lastLon / 1000000,
        ele: lastEle,
        time: lastTime
      });
    }
    return points;
  }

  // Generate GPX XML content
  function generateGpxXml(points) {
    var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<gpx version="1.1" creator="TopoNav" xmlns="http://www.topografix.com/GPX/1/1">\n';
    xml += '  <trk>\n';
    xml += '    <name>TopoNav Walked Track</name>\n';
    xml += '    <trkseg>\n';
    
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var timeStr = new Date(p.time).toISOString();
      xml += '      <trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lon.toFixed(6) + '">\n';
      xml += '        <ele>' + p.ele + '</ele>\n';
      xml += '        <time>' + timeStr + '</time>\n';
      xml += '      </trkpt>\n';
    }
    
    xml += '    </trkseg>\n';
    xml += '  </trk>\n';
    xml += '</gpx>\n';
    return xml;
  }

  // Trigger download of files in webview
  function triggerFileDownload(content, filename) {
    var blob = new Blob([content], { type: 'application/gpx+xml;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename + ".gpx";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Check for download triggers
  var downloadData = getQueryParam("download_gpx");
  var downloadName = getQueryParam("download_name") || "route";
  if (downloadData) {
    try {
      var pts = decompressTrack(downloadData);
      if (pts.length > 0) {
        var gpxXml = generateGpxXml(pts);
        triggerFileDownload(gpxXml, downloadName);
        
        // Clean URL params to prevent repeated downloads on refresh
        if (window.history.replaceState) {
          var cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
          var interval = getQueryParam("interval");
          var lang = getQueryParam("lang");
          var isNav = getQueryParam("is_nav");
          var trips = getQueryParam("trips");
          var params = [];
          if (interval) params.push("interval=" + interval);
          if (lang) params.push("lang=" + lang);
          if (isNav) params.push("is_nav=" + isNav);
          if (trips) params.push("trips=" + trips);
          if (params.length > 0) {
            cleanUrl += "?" + params.join("&");
          }
          window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }
      }
    } catch (e) {
      console.error('Download failed: ' + e.message);
    }
  }

  // Apply language at start
  applyLanguage(document.getElementById("app-lang").value);
</script>
